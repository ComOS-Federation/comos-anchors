# Hourly self-anchor of the ComOS Federation's disclosed hash chains: the
# key-binding attestation chain (CO 324-001) and the track-record chain
# (CO 571). Fetches each publicly disclosed chain head and, when it has
# changed, appends one JSONL line to anchors/<chain>.jsonl and commits. Uses
# only the default GITHUB_TOKEN — this repo carries no secrets and no branch
# protection; its value is its append-only public history, not its write
# controls.

name: anchor

on:
  schedule:
    - cron: '15 * * * *'   # hourly at :15 UTC (offset from the private twin)
  workflow_dispatch: {}

concurrency:
  group: anchor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch each chain head and append an anchor line if it changed
        env:
          FEDERATION_URL: https://mcp.comos-gateway.com
        run: |
          set -euo pipefail

          anchor_chain() {
            local CHAIN="$1"
            local RESPONSE HEAD_SEQ HEAD_HASH ANCHOR_FILE LAST_HASH ANCHORED_AT
            RESPONSE=$(curl -fsS --max-time 30 "$FEDERATION_URL/.well-known/$CHAIN?limit=1")
            HEAD_SEQ=$(echo "$RESPONSE" | jq -r '.head.seq // empty')
            HEAD_HASH=$(echo "$RESPONSE" | jq -r '.head.entry_hash // empty')

            if [ -z "$HEAD_SEQ" ] || [ -z "$HEAD_HASH" ]; then
              echo "$CHAIN: chain is empty. Nothing to anchor."
              return 0
            fi

            ANCHOR_FILE="anchors/$CHAIN.jsonl"
            LAST_HASH=$(tail -1 "$ANCHOR_FILE" 2>/dev/null | jq -r '.entry_hash // empty' || true)
            if [ "$HEAD_HASH" = "$LAST_HASH" ]; then
              echo "$CHAIN: head unchanged (seq $HEAD_SEQ). Nothing to anchor."
              return 0
            fi

            ANCHORED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            jq -cn --arg at "$ANCHORED_AT" --argjson seq "$HEAD_SEQ" --arg hash "$HEAD_HASH" \
              --arg source "$FEDERATION_URL/.well-known/$CHAIN" \
              '{anchored_at: $at, seq: $seq, entry_hash: $hash, source: $source}' >> "$ANCHOR_FILE"
            echo "$CHAIN: anchored head seq $HEAD_SEQ ($HEAD_HASH)."
          }

          anchor_chain key-attestation-chain
          anchor_chain track-record-chain

      - name: Commit + push (skip if nothing new)
        run: |
          if [ -z "$(git status --porcelain anchors/)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="anchor:"
          for F in $(git status --porcelain anchors/ | awk '{print $2}'); do
            LAST=$(tail -1 "$F")
            MSG="$MSG $(basename "$F" .jsonl) seq $(echo "$LAST" | jq -r '.seq') ($(echo "$LAST" | jq -r '.entry_hash' | cut -c1-8));"
          done
          git add anchors/
          git commit -m "${MSG%;}"
          git pull --rebase origin main
          git push origin HEAD:main
